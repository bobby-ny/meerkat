name: Bug report
description: Something on Meerkat is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Please leave out private package names and upload keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or command
      placeholder: https://meerkatsec.win/app/projects
